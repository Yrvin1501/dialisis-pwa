# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
              VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
              VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
              VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
              VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DASHBOARD_FRESENIUS_MEDICAL }}
          channelId: live
          projectId: dashboard-fresenius-medical
